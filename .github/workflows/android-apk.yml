name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build unsigned release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Collect APK and signing tools
        run: |
          mkdir apk-build
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-build/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" apk-build/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-build/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" apk-build/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-build
          path: apk-build/
          if-no-files-found: error
